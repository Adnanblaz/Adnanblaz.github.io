<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Guru & Staf</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 960px; }
        .student-name { cursor: pointer; color: #007bff; text-decoration: none !important; }
        .student-name:hover { color: #0056b3; }
        .details-row > td { padding: 0 !important; background-color: #e9ecef !important; border: none !important; }
        .details-content { padding: 1rem; }
        .back-link-container { text-align: center; margin-bottom: 10px; }
        .card-title-centered { text-align: center; }
    </style>
</head>
<body>
    <div class="container mt-4 mb-4">
        
        <div id="login-container" class="card">
            <div class="card-body">
                <div class="back-link-container"><a href="index.html" class="text-muted">&larr; Kembali ke Halaman Utama</a></div>
                <h3 class="card-title-centered">Portal Guru & Staf</h3>
                <form id="loginForm">
                    <div class="form-group"><label for="username">Username:</label><input type="text" id="username" name="username" class="form-control" required></div>
                    <div class="form-group"><label for="password">Password:</label><input type="password" id="password" name="password" class="form-control" required></div>
                    <button type="submit" id="loginButton" class="btn btn-primary btn-block">Login</button>
                    <div id="login-error" class="alert alert-danger mt-3" style="display:none;"></div>
                </form>
            </div>
        </div>

        <div id="main-container" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 id="welcome-message"></h4>
                <button id="logoutButton" class="btn btn-sm btn-outline-secondary">Logout</button>
            </div>
            <div id="semester-container" class="text-center card card-body">
                <h5>Pilih Semester untuk Melihat Rekap</h5>
                <div class="btn-group mt-2" role="group">
                    <button class="btn btn-info" onclick="fetchRekap(1)">Semester 1 (Juli - Des)</button>
                    <button class="btn btn-warning" onclick="fetchRekap(2)">Semester 2 (Jan - Juni)</button>
                </div>
            </div>
            <div id="content-container" class="mt-3"></div>
        </div>
    </div>
    
<script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyFcQAJyZUgbxRm9TrmgTWQqNF9jKQ-C5884VxMa-vDefwBwo47Mt1pvddKbmKDZUXP/exec';
    let currentUser = null;
    let fullRekapData = {};

    const loginContainer = document.getElementById('login-container');
    const mainContainer = document.getElementById('main-container');
    const welcomeMessage = document.getElementById('welcome-message');
    const logoutButton = document.getElementById('logoutButton');
    const contentContainer = document.getElementById('content-container');

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('login-error');
        loginButton.disabled = true;
        loginButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengecek...';
        loginError.style.display = 'none';

        const formData = new FormData(this);
        fetch(`${webAppUrl}?action=login&username=${formData.get('username')}&password=${formData.get('password')}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    currentUser = data.data;
                    loginContainer.style.display = 'none';
                    mainContainer.style.display = 'block';
                    welcomeMessage.innerHTML = `Selamat Datang, <strong>${currentUser.name}</strong>!`;
                } else {
                    loginError.textContent = data.message;
                    loginError.style.display = 'block';
                }
            }).finally(() => {
                loginButton.disabled = false;
                loginButton.innerHTML = 'Login';
            });
    });
    
    logoutButton.addEventListener('click', () => {
        currentUser = null;
        mainContainer.style.display = 'none';
        loginContainer.style.display = 'block';
        contentContainer.innerHTML = '';
    });

    function fetchRekap(semester) {
        contentContainer.innerHTML = '<div class="text-center mt-4"><div class="spinner-border"></div><p>Memuat rekap semester '+semester+'...</p></div>';
        const params = `?action=getRekap&role=${currentUser.role}&semester=${semester}&kelasDiampu=${currentUser.kelasDiampu || ''}`;
        
        fetch(webAppUrl + params)
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success'){
                    fullRekapData = result.data;
                    renderDashboard();
                } else {
                    contentContainer.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
                }
            });
    }

    function renderDashboard() {
        let html = '';
        if (currentUser.role === 'walikelas') {
            html += `<button class="btn btn-danger mb-3" onclick="showUnscannedForm()"><i class="fas fa-user-clock"></i> Absensi Siswa Tidak Hadir</button>`;
            html += renderTable(fullRekapData, `Rekap Kelas: ${currentUser.kelasDiampu}`);
        } else {
            html += '<div class="class-filters nav nav-pills mb-3" id="pills-tab" role="tablist">';
            const kelasKeys = Object.keys(fullRekapData).sort();
            kelasKeys.forEach((kelas, index) => {
                const kelasId = kelas.replace(/\s+/g, '');
                html += `<a class="nav-link ${index === 0 ? 'active' : ''}" id="pills-${kelasId}-tab" data-toggle="pill" href="#pills-${kelasId}" role="tab">${kelas}</a>`;
            });
            html += '</div>';
            
            html += '<div class="tab-content" id="pills-tabContent">';
            kelasKeys.forEach((kelas, index) => {
                const kelasId = kelas.replace(/\s+/g, '');
                html += `<div class="tab-pane fade ${index === 0 ? 'show active' : ''}" id="pills-${kelasId}" role="tabpanel">`;
                html += renderTable(fullRekapData[kelas], `Rekap Kelas: ${kelas}`);
                html += '</div>';
            });
            html += '</div>';
        }
        contentContainer.innerHTML = html;
    }

    function renderTable(dataSiswa, title) {
        if (!dataSiswa || dataSiswa.length === 0) return '<div class="alert alert-info">Tidak ada data untuk ditampilkan.</div>';
        
        let tableHtml = `<div class="card"><div class="card-body"><h5 class="card-title">${title}</h5><p class="card-text small text-muted">Klik nama siswa untuk melihat rincian ketidakhadiran & melakukan koreksi.</p><div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>No</th><th>Nama Siswa</th><th>Sakit</th><th>Izin</th><th>Alfa</th></tr></thead><tbody>`;
        
        dataSiswa.sort((a,b) => a.nomorAbsen - b.nomorAbsen).forEach(siswa => {
            tableHtml += `
                <tr onclick="toggleDetails('${siswa.nisn}')" style="cursor: pointer;">
                    <td>${siswa.nomorAbsen}</td>
                    <td><span class="student-name">${siswa.nama}</span></td>
                    <td>${siswa.total.sakit}</td>
                    <td>${siswa.total.izin}</td>
                    <td>${siswa.total.alpha}</td>
                </tr>
                <tr id="detail-${siswa.nisn}" class="details-row" style="display: none;"><td colspan="5"><div class="details-content"></div></td></tr>
            `;
        });
        tableHtml += '</tbody></table></div></div></div>';
        return tableHtml;
    }

    function toggleDetails(nisn) {
        const allDetailRows = document.querySelectorAll('.details-row');
        const targetDetailRow = document.getElementById(`detail-${nisn}`);
        const wasOpen = targetDetailRow.style.display !== 'none';
        
        allDetailRows.forEach(row => { if(row.id !== targetDetailRow.id) row.style.display = 'none'; });
        
        if (!wasOpen) {
            targetDetailRow.style.display = 'table-row';
            const detailCell = targetDetailRow.querySelector('.details-content');
            if (detailCell.innerHTML.trim() === '') {
                const siswaData = findSiswaByNisn(nisn);
                detailCell.innerHTML = renderDetailContent(siswaData);
            }
        } else {
            targetDetailRow.style.display = 'none';
        }
    }
    
    function findSiswaByNisn(nisn) {
        if(Array.isArray(fullRekapData)) return fullRekapData.find(s => s.nisn === nisn);
        for(const kelas in fullRekapData) {
            const siswa = fullRekapData[kelas].find(s => s.nisn === nisn);
            if (siswa) return siswa;
        }
    }

    function renderDetailContent(siswa) {
        if (!siswa.detailUntukEdit || siswa.detailUntukEdit.length === 0) return '<div class="alert alert-light">Tidak ada catatan ketidakhadiran untuk dikoreksi.</div>';
        let detailHtml = '<table class="table table-bordered table-sm"><thead><tr><th>Tanggal</th><th>Status</th>';
        if(currentUser.canEdit) detailHtml += '<th>Aksi</th>';
        detailHtml += '</tr></thead><tbody>';

        siswa.detailUntukEdit.sort((a,b) => new Date(b.uniqueId.split('-')[0]) - new Date(a.uniqueId.split('-')[0])).forEach(d => {
            detailHtml += `<tr id="row-${d.uniqueId}">
                <td>${d.tanggal}</td>
                <td class="status-cell">${d.status}</td>`;
            if(currentUser.canEdit) {
                 detailHtml += `<td class="action-cell"><button onclick="event.stopPropagation(); toggleEditMode('${d.uniqueId}', '${d.status}')" class="btn btn-warning btn-sm" title="Edit"><i class="fas fa-edit"></i></button></td>`;
            }
            detailHtml += `</tr>`;
        });
        detailHtml += '</tbody></table>';
        return detailHtml;
    }

    function toggleEditMode(uniqueId, currentStatus) {
        const row = document.getElementById(`row-${uniqueId}`);
        row.dataset.originalStatus = currentStatus;
        row.querySelector('.status-cell').innerHTML = `<select id="select-${uniqueId}" class="form-control form-control-sm"><option value="Sakit" ${currentStatus === 'Sakit' ? 'selected' : ''}>Sakit</option><option value="Izin" ${currentStatus === 'Izin' ? 'selected' : ''}>Izin</option><option value="Tanpa Keterangan" ${currentStatus === 'Tanpa Keterangan' ? 'selected' : ''}>Tanpa Keterangan</option></select>`;
        row.querySelector('.action-cell').innerHTML = `<button onclick="event.stopPropagation(); saveEdit('${uniqueId}')" class="btn btn-success btn-sm" title="Simpan"><i class="fas fa-save"></i></button> <button onclick="event.stopPropagation(); cancelEdit('${uniqueId}')" class="btn btn-secondary btn-sm" title="Batal"><i class="fas fa-times"></i></button>`;
    }
    
    function cancelEdit(uniqueId) {
        const row = document.getElementById(`row-${uniqueId}`);
        const originalStatus = row.dataset.originalStatus;
        row.querySelector('.status-cell').textContent = originalStatus;
        row.querySelector('.action-cell').innerHTML = `<button onclick="event.stopPropagation(); toggleEditMode('${uniqueId}', '${originalStatus}')" class="btn btn-warning btn-sm" title="Edit"><i class="fas fa-edit"></i></button>`;
    }

    function saveEdit(uniqueId) {
        const actionCell = document.getElementById(`row-${uniqueId}`).querySelector('.action-cell');
        actionCell.innerHTML = '<div class="spinner-border spinner-border-sm"></div>';
        const newStatus = document.getElementById(`select-${uniqueId}`).value;
        fetch(webAppUrl, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'editSingle', uniqueId: uniqueId, newStatus: newStatus }),
        }).then(() => {
             alert('Perubahan berhasil diproses! Silakan pilih semester lagi untuk melihat data terbaru.');
             contentContainer.innerHTML = '';
        });
    }

    function showUnscannedForm() {
        contentContainer.innerHTML = '<div class="text-center mt-4"><div class="spinner-border"></div><p>Mencari siswa belum absen...</p></div>';
        fetch(`${webAppUrl}?action=getUnscanned&kelasDiampu=${currentUser.kelasDiampu}`)
            .then(res => res.json())
            .then(result => {
                if(result.data.length === 0){
                    contentContainer.innerHTML = '<div class="alert alert-success">Semua siswa di kelas Anda sudah tercatat kehadirannya hari ini.</div>';
                    return;
                }
                let formHtml = `<div class="card"><div class="card-body"><h5 class="card-title">Input Absensi Siswa Tidak Hadir</h5><form id="unscannedForm"><div class="table-responsive"><table class="table table-sm">`;
                result.data.forEach(siswa => {
                    formHtml += `<tr><td>${siswa.nama}</td><td><select class="form-control form-control-sm" data-nisn="${siswa.nisn}"><option value="">-- Pilih Status --</option><option value="Sakit">Sakit</option><option value="Izin">Izin</option><option value="Tanpa Keterangan">Tanpa Keterangan</option></select></td></tr>`;
                });
                formHtml += '</table></div><button type="submit" class="btn btn-success mt-3"><i class="fas fa-save"></i> Simpan Semua & Kirim Notifikasi</button></form></div></div>';
                contentContainer.innerHTML = formHtml;
                document.getElementById('unscannedForm').addEventListener('submit', saveUnscanned);
            });
    }

    function saveUnscanned(e) {
        e.preventDefault();
        const button = this.querySelector('button');
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        
        const selections = this.querySelectorAll('select');
        const absensiData = Array.from(selections).map(select => ({ nisn: select.dataset.nisn, status: select.value })).filter(item => item.status !== "");

        if(absensiData.length === 0){
            alert('Tidak ada status yang dipilih untuk disimpan.');
            button.disabled = false; button.innerHTML = '<i class="fas fa-save"></i> Simpan Semua & Kirim Notifikasi';
            return;
        }

        fetch(webAppUrl, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'saveUnscanned', absensi: absensiData })
        }).then(() => {
            alert('Data siswa tidak hadir berhasil disimpan dan notifikasi sedang dikirim. Halaman akan dimuat ulang.');
            location.reload();
        });
    }
</script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
