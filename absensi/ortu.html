<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa & Orang Tua</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .back-link-container { text-align: center; margin-bottom: 10px; }
        .card-title-centered { text-align: center; }
    </style>
</head>
<body>
    <div class="container mt-4 mb-4">
        
        <div id="login-container" class="card">
            <div class="card-body">
                <div class="back-link-container"><a href="index.html" class="text-muted">&larr; Kembali ke Halaman Utama</a></div>
                <h3 class="card-title-centered">Portal Siswa</h3>
                <p class="text-center text-muted">Silakan login untuk melihat rekap kehadiran.</p>
                <form id="loginFormSiswa">
                    <div class="form-group">
                        <label for="nisn">Nomor Induk Siswa Nasional (NISN):</label>
                        <input type="text" id="nisn" name="nisn" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="tglLahir">Tanggal Lahir (Format: DDMMYYYY):</label>
                        <input type="text" id="tglLahir" name="tglLahir" class="form-control" placeholder="Contoh: 05082010" required>
                    </div>
                    <button type="submit" id="loginButton" class="btn btn-primary btn-block">Login</button>
                    <div id="login-error" class="alert alert-danger mt-3" style="display:none;"></div>
                </form>
            </div>
        </div>

        <div id="rekap-container" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 id="welcome-message-siswa"></h4>
                <button id="logoutButtonSiswa" class="btn btn-sm btn-outline-secondary">Logout</button>
            </div>
            <div class="text-center card card-body">
                <h5>Pilih Semester untuk Melihat Rekap</h5>
                <div class="btn-group mt-2" role="group">
                    <button class="btn btn-info" onclick="fetchRekapSiswa(1)">Semester 1 (Juli - Des)</button>
                    <button class="btn btn-warning" onclick="fetchRekapSiswa(2)">Semester 2 (Jan - Juni)</button>
                </div>
            </div>
            <div id="content-container" class="mt-3"></div>
        </div>
    </div>
    
<script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyFcQAJyZUgbxRm9TrmgTWQqNF9jKQ-C5884VxMa-vDefwBwo47Mt1pvddKbmKDZUXP/exec';
    let currentSiswa = null;

    const loginContainer = document.getElementById('login-container');
    const rekapContainer = document.getElementById('rekap-container');
    const welcomeMessage = document.getElementById('welcome-message-siswa');
    const contentContainer = document.getElementById('content-container');

    document.getElementById('loginFormSiswa').addEventListener('submit', function(e) {
        e.preventDefault();
        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('login-error');
        loginButton.disabled = true;
        loginButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengecek...';
        loginError.style.display = 'none';

        const nisn = document.getElementById('nisn').value;
        const tglLahir = document.getElementById('tglLahir').value;

        fetch(`${webAppUrl}?action=loginOrtu&nisn=${nisn}&tglLahir=${tglLahir}`)
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success'){
                    currentSiswa = { nisn: nisn, tglLahir: tglLahir, nama: result.data.nama };
                    loginContainer.style.display = 'none';
                    rekapContainer.style.display = 'block';
                    welcomeMessage.innerHTML = `Selamat Datang, <strong>${currentSiswa.nama}</strong>`;
                } else {
                    loginError.textContent = result.message;
                    loginError.style.display = 'block';
                }
            })
            .catch(err => {
                loginError.textContent = "Gagal terhubung ke server.";
                loginError.style.display = 'block';
            })
            .finally(() => {
                loginButton.disabled = false;
                loginButton.innerHTML = 'Login';
            });
    });
    
    document.getElementById('logoutButtonSiswa').addEventListener('click', () => {
        currentSiswa = null;
        rekapContainer.style.display = 'none';
        loginContainer.style.display = 'block';
        contentContainer.innerHTML = '';
        document.getElementById('loginFormSiswa').reset();
    });

    function fetchRekapSiswa(semester) {
        contentContainer.innerHTML = '<div class="text-center mt-4"><div class="spinner-border"></div><p>Memuat rekap semester '+semester+'...</p></div>';
        const params = `?action=getRekapOrtu&nisn=${currentSiswa.nisn}&tglLahir=${currentSiswa.tglLahir}&semester=${semester}`;
        
        fetch(webAppUrl + params)
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success'){
                    renderRekapSiswa(result.data, semester);
                } else {
                    contentContainer.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
                }
            });
    }

    function renderRekapSiswa(data, semester) {
        let html = `<div class="card"><div class="card-body">
            <h5 class="card-title">Rekap Semester ${semester}</h5>
            <p><strong>Nama Siswa:</strong> ${data.nama}<br><strong>Kelas:</strong> ${data.kelas}</p>
            <table class="table table-bordered text-center table-sm">
                <thead class="thead-dark"><tr><th>Total Sakit</th><th>Total Izin</th><th>Total Alfa</th></tr></thead>
                <tbody><tr>
                    <td>${data.total.sakit} Hari</td>
                    <td>${data.total.izin} Hari</td>
                    <td>${data.total.alpha} Hari</td>
                </tr></tbody>
            </table>
            <hr>
            <h6 class="mt-4">Rincian Kehadiran Lengkap</h6>`;

        if (data.detail && data.detail.length > 0) {
            html += `<div class="table-responsive"><table class="table table-sm table-striped"><thead><tr><th>Tanggal & Waktu</th><th>Status</th></tr></thead><tbody>`;
            data.detail.forEach(d => {
                let badgeClass = 'badge-secondary';
                if(d.status === 'Sakit') badgeClass = 'badge-warning';
                if(d.status === 'Izin') badgeClass = 'badge-info';
                if(d.status === 'Masuk') badgeClass = 'badge-success';
                if(d.status === 'Pulang') badgeClass = 'badge-primary';
                if(d.status === 'Tanpa Keterangan') badgeClass = 'badge-danger';
                html += `<tr><td>${d.tanggal}</td><td><span class="badge ${badgeClass} p-2">${d.status}</span></td></tr>`;
            });
            html += `</tbody></table></div>`;
        } else {
            html += `<div class="alert alert-success">Tidak ada catatan kehadiran pada semester ini.</div>`;
        }

        html += '</div></div>';
        contentContainer.innerHTML = html;
    }
</script>
</body>
</html>
