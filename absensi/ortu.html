<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Orang Tua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
        <h2>Cek Kehadiran Siswa</h2>
        <form id="cekForm">
            <label for="nisn">Nomor Induk Siswa Nasional (NISN):</label>
            <input type="text" id="nisn" required>
            
            <label for="tglLahir">Tanggal Lahir (Format: MM-DD-YYYY):</label>
            <input type="text" id="tglLahir" placeholder="Contoh: 07-15-2010" required>
            
            <button type="submit" class="btn btn-primary">Cek Kehadiran</button>
        </form>
        
        <div id="loading" style="display:none;">Mencari data...</div>
        <div id="hasil"></div>
    </div>

<script>
    document.getElementById('cekForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // ... (kode untuk mengambil nisn, tglLahir, dll tetap sama) ...
        const hasilDiv = document.getElementById('hasil');
        const loadingDiv = document.getElementById('loading');
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbyFcQAJyZUgbxRm9TrmgTWQqNF9jKQ-C5884VxMa-vDefwBwo47Mt1pvddKbmKDZUXP/exec';
        
        hasilDiv.innerHTML = '';
        loadingDiv.style.display = 'block';
        
        fetch(`${webAppUrl}?type=ortu&nisn=${nisn.value}&tglLahir=${tglLahir.value}`)
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = 'none';
                if (data.error) {
                    hasilDiv.innerHTML = `<p style="color:red; font-weight:bold;">${data.error}</p>`;
                } else {
                    let htmlContent = `<h3>Rekap Kehadiran: ${data.nama}</h3>`;
                    
                    // Tampilkan Tabel Total
                    htmlContent += `<div class="table-wrapper">
                                      <table>
                                        <tr><th>Sakit</th><th>Izin</th><th>Tanpa Keterangan</th></tr>
                                        <tr><td>${data.total.sakit} kali</td><td>${data.total.izin} kali</td><td>${data.total.alpha} kali</td></tr>
                                      </table>
                                    </div><hr>`;

                    // Tampilkan Rincian Tanggal Sakit
                    if (data.rincian.sakit.length > 0) {
                        htmlContent += `<h4>Rincian Tanggal Sakit:</h4><ul>`;
                        data.rincian.sakit.forEach(tgl => { htmlContent += `<li>${tgl}</li>`; });
                        htmlContent += `</ul>`;
                    }
                    
                    // Tampilkan Rincian Tanggal Izin
                    if (data.rincian.izin.length > 0) {
                        htmlContent += `<h4>Rincian Tanggal Izin:</h4><ul>`;
                        data.rincian.izin.forEach(tgl => { htmlContent += `<li>${tgl}</li>`; });
                        htmlContent += `</ul>`;
                    }
                    
                    // Tampilkan Rincian Tanpa Keterangan
                    if (data.rincian.alpha.length > 0) {
                        htmlContent += `<h4>Rincian Tanggal Tanpa Keterangan:</h4><ul>`;
                        data.rincian.alpha.forEach(tgl => { htmlContent += `<li>${tgl}</li>`; });
                        htmlContent += `</ul>`;
                    }

                    hasilDiv.innerHTML = htmlContent;
                }
            })
            .catch(error => { /* (handle error) */ });
    });
</script>
</body>
</html>
