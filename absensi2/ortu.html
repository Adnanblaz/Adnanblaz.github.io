<script>
    // --- GANTI DENGAN KONFIGURASI FIREBASE ANDA ---
    const firebaseConfig = {
        apiKey: "AIzaSyD4nAPhGV-USPyElTyHwiDZO0ZvUGRoK5E",
        authDomain: "sistem-absensi-sdn-cicohag.firebaseapp.com",
        projectId: "sistem-absensi-sdn-cicohag",
        storageBucket: "sistem-absensi-sdn-cicohag.appspot.com",
        messagingSenderId: "540116242535",
        appId: "1:540116242535:web:41e3e1e7456ecf1c6584c2"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    let nilaiChartInstance = null; // Untuk menyimpan objek grafik
    let ortuHistoricalGrades = []; // Untuk menyimpan data nilai historis
    const daftarMapelMaster = [ // Daftar ini harus sama dengan di guru.html
        "Pendidikan Agama", "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika",
        "IPAS", "PJOK", "Seni Budaya", "Bahasa Inggris", "Bahasa Sunda"
    ];
    let currentSiswa = null;
    
    // REVISI: Pemilihan elemen-elemen baru
    const mainContentWrapper = document.getElementById('main-content-wrapper');
    const portalNavbar = document.getElementById('portal-navbar');
    const loginContainer = document.getElementById('login-container');
    const rekapContainer = document.getElementById('rekap-container');
    const welcomeMessage = document.getElementById('welcome-message-siswa');
    const contentContainer = document.getElementById('content-container');
    // Logika untuk fitur Lihat/Sembunyikan Password
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('tglLahir');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function () {
        // Cek tipe input
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Ganti ikon mata
        toggleIcon.classList.toggle('fa-eye-slash');
    });

    document.getElementById('loginFormSiswa').addEventListener('submit', async function(e) {
        e.preventDefault();
        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('login-error');
        loginButton.disabled = true;
        loginButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengecek...';
        loginError.style.display = 'none';

        const nisn = document.getElementById('nisn').value;
        const tglLahir = document.getElementById('tglLahir').value;

        try {
            const snapshot = await db.collection('siswa').where('nisn', '==', nisn).where('tglLahir', '==', tglLahir).where('status', '==', 'Aktif').get();
            if (snapshot.empty) throw new Error("NISN atau Password salah, atau siswa tidak aktif.");
            
            const siswaData = snapshot.docs[0].data();
            currentSiswa = { nisn: nisn, tglLahir: tglLahir, nama: siswaData.nama, kelas: siswaData.kelas };
            
            loginContainer.style.display = 'none';
            portalNavbar.style.display = 'flex';
            rekapContainer.style.display = 'block';
            mainContentWrapper.classList.remove('align-items-center', 'min-vh-100');

            welcomeMessage.innerHTML = `Selamat Datang, <strong>${currentSiswa.nama}</strong>!`;
            
            // Panggil kedua fungsi untuk memuat data absensi dan nilai
            await fetchRekapSiswa(1); 
            await fetchNilaiSiswa(); // Fungsi ini akan kita buat di langkah berikutnya

        } catch (error) {
            loginError.textContent = error.message;
            loginError.style.display = 'block';
        } finally {
            loginButton.disabled = false;
            loginButton.innerHTML = 'Login <i class="fas fa-sign-in-alt ml-2"></i>';
        }
    });
    
    document.getElementById('logoutButtonSiswa').addEventListener('click', () => {
        currentSiswa = null;
        
        // REVISI: Logika untuk menyembunyikan navbar & konten rekap, lalu menampilkan login
        portalNavbar.style.display = 'none';
        rekapContainer.style.display = 'none';
        loginContainer.style.display = 'block';
        mainContentWrapper.classList.add('align-items-center', 'min-vh-100'); // Kembalikan centering vertikal

        contentContainer.innerHTML = '';
        document.getElementById('jadwalModalBody').innerHTML = '';
        document.getElementById('loginFormSiswa').reset();
    });

    document.getElementById('showJadwalBtn').addEventListener('click', fetchInfoJadwal);

    async function fetchRekapSiswa(semester) {
        contentContainer.innerHTML = '<div class="text-center mt-4"><div class="spinner-border text-primary"></div><p class="text-muted">Memuat rekap semester...</p></div>';
        
        document.querySelectorAll('.semester-btn').forEach((btn, index) => {
            btn.classList.toggle('btn-primary', index + 1 === semester);
            btn.classList.toggle('btn-outline-primary', index + 1 !== semester);
        });

        const currentYear = new Date().getFullYear();
        const cacheDocId = `${currentSiswa.nisn}_${currentYear}_${semester}`;
        const cacheRef = db.collection('cache_rekap_semester').doc(cacheDocId);

        try {
            const docSnap = await cacheRef.get();
            let rekapData;

            if (docSnap.exists) {
                const dataFromCache = docSnap.data();
                rekapData = {
                    nama: dataFromCache.nama,
                    kelas: dataFromCache.kelas,
                    total: {
                        sakit: dataFromCache.totalSakit || 0,
                        izin: dataFromCache.totalIzin || 0,
                        alpha: dataFromCache.totalAlpha || 0
                    },
                    detail: dataFromCache.detailAbsensi || []
                };
            } else {
                rekapData = {
                    nama: currentSiswa.nama,
                    kelas: currentSiswa.kelas,
                    total: { sakit: 0, izin: 0, alpha: 0 },
                    detail: []
                };
            }
            renderRekapSiswa(rekapData, semester);
        } catch (error) {
            contentContainer.innerHTML = `<div class="alert alert-danger mt-4"><i class="fas fa-exclamation-circle mr-2"></i> Gagal memuat rekap semester. ${error.message}</div>`;
            console.error("Error fetching rekap siswa:", error);
        }
    }

    async function fetchInfoJadwal() {
        const modalBody = document.getElementById('jadwalModalBody');
        
        // Selalu tampilkan spinner dan fetch ulang agar data selalu terbaru
        modalBody.innerHTML = '<div class="text-center mt-4"><div class="spinner-border text-primary"></div><p class="text-muted">Memuat info & jadwal...</p></div>';
        $('#jadwalModal').modal('show');

        try {
            const docRef = db.collection('info_kelas').doc(currentSiswa.kelas);
            const docSnap = await docRef.get();
            const data = docSnap.exists ? docSnap.data() : {};
            renderInfoJadwal(data);
        } catch (error) {
            modalBody.innerHTML = `<div class="alert alert-danger">Gagal memuat jadwal: ${error.message}</div>`;
        }
    }

    function renderInfoJadwal(data) {
        const modalBody = document.getElementById('jadwalModalBody');
        const parseData = (textData) => {
            if (!textData || textData.trim() === '') {
                return '<p class="text-muted text-center p-3">Informasi belum ditambahkan oleh wali kelas.</p>';
            }
            // Mengganti newline menjadi list item HTML
            return `<ul class="list-group list-group-flush">${textData.split('\n').map(item => `<li class="list-group-item">${item.trim()}</li>`).join('')}</ul>`;
        };

        modalBody.innerHTML = `
            <ul class="nav nav-pills nav-fill mb-3" id="jadwalTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="pelajaran-tab-modal" data-toggle="pill" href="#pelajaran-content-modal" role="tab">Pelajaran</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="piket-tab-modal" data-toggle="pill" href="#piket-content-modal" role="tab">Piket</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="seragam-tab-modal" data-toggle="pill" href="#seragam-content-modal" role="tab">Seragam</a>
                </li>
            </ul>
            <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="pelajaran-content-modal" role="tabpanel">
                    ${parseData(data.pelajaran)}
                </div>
                <div class="tab-pane fade" id="piket-content-modal" role="tabpanel">
                    ${parseData(data.piket)}
                </div>
                <div class="tab-pane fade" id="seragam-content-modal" role="tabpanel">
                    ${parseData(data.seragam)}
                </div>
            </div>
        `;
    }

    function getBadgeClass(status) {
        switch (status) {
            case 'Sakit': return 'badge-warning'; 
            case 'Izin': return 'badge-info'; 
            case 'Tanpa Keterangan': case 'Alfa': return 'badge-danger'; 
            default: return 'badge-secondary'; 
        }
    }

// GANTI KESELURUHAN FUNGSI INI
function renderRekapSiswa(data, semester) {
    data.detail.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

    let html = `
        <div class="card shadow-sm rounded-xl card-mobile-flat">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="card-title text-primary font-weight-bold mb-0"><i class="fas fa-calendar-check mr-2"></i> Rekap Absensi Semester ${semester}</h5>
                    <button id="changeSemesterBtn" class="btn btn-outline-primary btn-sm" title="Ganti Semester">
                        <i class="fas fa-exchange-alt fa-lg"></i> </button>
                </div>
                <p class="text-muted small mb-4">Untuk Ananda ${data.nama} (Kelas ${data.kelas})</p>

                <div class="row text-center no-gutters mb-3">
                    <div class="col-4 px-1"><div class="p-3 rounded-lg" style="background-color: #fff8e1;"><h4 class="font-weight-bolder text-warning mb-1">${data.total.sakit}</h4><p class="small font-weight-bold text-secondary mb-0">Sakit</p></div></div>
                    <div class="col-4 px-1"><div class="p-3 rounded-lg" style="background-color: #e3f2fd;"><h4 class="font-weight-bolder text-info mb-1">${data.total.izin}</h4><p class="small font-weight-bold text-secondary mb-0">Izin</p></div></div>
                    <div class="col-4 px-1"><div class="p-3 rounded-lg" style="background-color: #fbe9e7;"><h4 class="font-weight-bolder text-danger mb-1">${data.total.alpha}</h4><p class="small font-weight-bold text-secondary mb-0">Alfa</p></div></div>
                </div>`;

    const rincianModalBody = document.getElementById('rincianAbsenModalBody');
    let rincianHtml = '';

    if (data.detail && data.detail.length > 0) {
        const totalAbsen = data.total.sakit + data.total.izin + data.total.alpha;
        html += `<div class="text-center mt-3"><span class="text-muted">Total ${totalAbsen} kali ketidakhadiran. </span><button id="bukaRincianAbsenBtn" class="btn btn-link p-0">Lihat Rincian</button></div>`;

        rincianHtml += `<ul class="list-group list-group-flush">`;
        data.detail.forEach(d => {
            const badgeClass = getBadgeClass(d.status);
            const formattedDate = new Date(d.tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            rincianHtml += `<li class="list-group-item d-flex justify-content-between align-items-center px-1"><div><small class="text-muted">${formattedDate}</small></div><span class="badge ${badgeClass} p-2" style="font-size: 0.8rem;">${d.status}</span></li>`;
        });
        rincianHtml += `</ul>`;

    } else {
        html += `<div class="alert alert-success mt-3 text-center"><i class="fas fa-check-circle mr-2"></i> Ananda selalu hadir pada semester ini. Luar biasa!</div>`;
        rincianHtml = '<p class="text-muted text-center">Tidak ada rincian ketidakhadiran.</p>';
    }

    html += '</div></div>';
    contentContainer.innerHTML = html;
    rincianModalBody.innerHTML = rincianHtml;

    // Tambahkan event listener ke tombol "Lihat Rincian" jika ada
    const bukaRincianBtn = document.getElementById('bukaRincianAbsenBtn');
    if (bukaRincianBtn) {
        bukaRincianBtn.addEventListener('click', () => {
            $('#rincianAbsenModal').modal('show');
        });
    }

    // Tambahkan event listener untuk ikon panah "Ganti Semester"
    const changeSemesterBtn = document.getElementById('changeSemesterBtn');
    if (changeSemesterBtn) {
        changeSemesterBtn.addEventListener('click', () => {
            // Atur status tombol di modal sesuai semester saat ini
            document.querySelectorAll('#selectSemesterModal .semester-select-option').forEach(btn => {
                if (parseInt(btn.dataset.semester) === semester) {
                    btn.classList.add('btn-primary');
                    btn.classList.remove('btn-outline-primary');
                } else {
                    btn.classList.add('btn-outline-primary');
                    btn.classList.remove('btn-primary');
                }
            });
            $('#selectSemesterModal').modal('show');
        });
    }
}
    
// GANTI FUNGSI INI
async function fetchNilaiSiswa() {
    const nilaiContainer = document.getElementById('nilai-container');
    
    try {
        const nilaiSnapshot = await db.collection('siswa').doc(currentSiswa.nisn)
            .collection('nilai_rapor')
            .orderBy('tahunAjaran')
            .orderBy('semester')
            .get();

        if (nilaiSnapshot.empty) {
            nilaiContainer.innerHTML = '<div class="card-body"><h5 class="card-title text-primary font-weight-bold"><i class="fas fa-chart-line mr-2"></i> Tren Nilai Rapor</h5><p class="text-center text-muted p-3">Belum ada data nilai rapor yang diinput.</p></div>';
            return;
        }

        ortuHistoricalGrades = nilaiSnapshot.docs.map(doc => doc.data());
        
        // --- PERBAIKAN: Ambil juga data rata-rata kelas ---
        const rekapPromises = ortuHistoricalGrades.map(grade => {
            const rekapDocId = `kelas_${grade.kelas}_semester_${grade.semester}_${grade.tahunAjaran}`;
            return db.collection('rekap_nilai_kelas').doc(rekapDocId).get();
        });
        
        const rekapDocs = await Promise.all(rekapPromises);
        rekapDocs.forEach((doc, index) => {
            if (doc.exists) {
                // Gabungkan data rekap kelas ke dalam data nilai siswa
                ortuHistoricalGrades[index].rekapKelas = doc.data();
            }
        });
        // --- AKHIR PERBAIKAN ---

        renderGrafikDanUnduhan();

    } catch (error) {
        console.error("Gagal mengambil data nilai:", error);
        nilaiContainer.innerHTML += `<div class="alert alert-danger">Tidak dapat memuat data nilai. ${error.message}</div>`;
    }
}

// GANTI KESELURUHAN FUNGSI INI
function renderGrafikDanUnduhan() {
    const nilaiContainer = document.getElementById('nilai-container');
    const grades = ortuHistoricalGrades;

    nilaiContainer.innerHTML = `
        <div class="card-body">
            <h5 class="card-title text-primary font-weight-bold"><i class="fas fa-chart-line mr-2"></i> Tren Nilai Rapor</h5>
            
            <div class="d-flex justify-content-start align-items-center flex-wrap py-2">
                <span class="mr-2 text-muted">Menampilkan:</span>
                <strong id="filter-display-text" class="mr-3">Rata-rata Keseluruhan</strong>
                <button id="bukaFilterModalBtn" class="btn btn-outline-primary btn-sm" title="Ganti Grafik"><i class="fas fa-exchange-alt fa-lg"></i></button>
            </div>
            
            <div class="mt-2" style="height: 300px;">
                <canvas id="nilaiChart"></canvas>
            </div>
        </div>
    `;

    // --- PERBAIKAN: Tambahkan `justify-content-center` ---
    const filterModalBody = document.getElementById('filterModalBody');
    let filterButtonsHtml = '<div class="d-flex flex-wrap justify-content-center">';
    filterButtonsHtml += '<button class="btn btn-primary btn-sm m-1 flex-shrink-0 mapel-filter-btn" data-mapel="rata-rata">Rata-rata</button>';
    daftarMapelMaster.forEach(mapel => {
        filterButtonsHtml += `<button class="btn btn-outline-primary btn-sm m-1 flex-shrink-0 mapel-filter-btn" data-mapel="${mapel}">${mapel}</button>`;
    });
    filterButtonsHtml += '</div>';
    filterModalBody.innerHTML = filterButtonsHtml;
    // --- AKHIR PERBAIKAN ---

    const drawChart = (filter = 'rata-rata') => {
        const labels = grades.map(g => `Kls ${g.kelas} - Smt ${g.semester}`);
        let dataSiswa, dataKelas;
        
        if (filter === 'rata-rata') {
            dataSiswa = grades.map(g => g.nilaiRataRata);
            dataKelas = grades.map(g => (g.rekapKelas) ? g.rekapKelas.rataRataKeseluruhan : null);
        } else {
            dataSiswa = grades.map(g => (g.daftarNilai && g.daftarNilai[filter] !== undefined) ? g.daftarNilai[filter] : null);
            dataKelas = grades.map(g => (g.rekapKelas && g.rekapKelas[filter] !== undefined) ? g.rekapKelas[filter] : null);
        }

        if (nilaiChartInstance) {
            nilaiChartInstance.destroy();
        }
        
        const ctx = document.getElementById('nilaiChart').getContext('2d');
        nilaiChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { 
                        label: 'Nilai Siswa',
                        data: dataSiswa,
                        backgroundColor: 'rgba(0, 86, 179, 0.2)',
                        borderColor: 'rgba(0, 86, 179, 1)',
                        borderWidth: 3,
                        tension: 0.3,
                        pointBackgroundColor: 'rgba(0, 86, 179, 1)',
                        pointRadius: 5
                    },
                    { 
                        label: 'Rata-rata Kelas',
                        data: dataKelas,
                        backgroundColor: 'rgba(220, 53, 69, 0.2)',
                        borderColor: 'rgba(220, 53, 69, 1)',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.3,
                        pointBackgroundColor: 'rgba(220, 53, 69, 1)',
                        pointRadius: 5
                    }
                ]
            },
            plugins: [ChartDataLabels],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 100 } },
                plugins: { 
                    legend: { display: true, position: 'top' },
                    // SISIPKAN BLOK KODE BARU INI
                    datalabels: {
                        // Fungsi untuk mengatur posisi label
                        // Label akan di 'atas' untuk data siswa (datasetIndex 0)
                        // dan di 'bawah' untuk rata-rata kelas (datasetIndex 1)
                        align: function(context) {
                            return context.datasetIndex === 0 ? 'top' : 'bottom';
                        },
                        offset: 4, // Memberi sedikit jarak dari titik data
                        backgroundColor: 'rgba(255, 255, 255, 0.8)',
                        borderRadius: 4,
                        font: { weight: 'bold' },
                        formatter: function(value) { return value; },
                        padding: 4,
                        // Fungsi untuk mengatur warna teks label
                        // Warna akan disamakan dengan warna garis grafiknya
                        color: function(context) {
                            return context.dataset.borderColor;
                        }
                    }
                }
            }
        });
    };
    
    const downloadModalBody = document.getElementById('downloadModalBody');
    let downloadHtml = '';
    const gradesByClass = grades.reduce((acc, grade) => {
        const key = `Kelas ${grade.kelas}`;
        if (!acc[key]) {
            acc[key] = { tahunAjaran: grade.tahunAjaran, links: [] };
        }
        acc[key].links.push(grade);
        return acc;
    }, {});
    const sortedClasses = Object.keys(gradesByClass).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    if (sortedClasses.length > 0) {
        sortedClasses.forEach((className, index) => {
            const classData = gradesByClass[className];
            const classId = className.replace(' ', '');
            const isActive = index === 0;
            downloadHtml += `<a href="#${classId}" data-toggle="collapse" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ${isActive ? 'active' : ''}"><strong class="${isActive ? 'text-white' : ''}">${className} (Tahun Ajaran ${classData.tahunAjaran}/${classData.tahunAjaran + 1})</strong><i class="fas fa-chevron-down"></i></a><div class="collapse ${isActive ? 'show' : ''}" id="${classId}">`;
            classData.links.sort((a, b) => b.semester - a.semester).forEach(grade => {
                if (grade.linkPDF) {
                    const semesterText = grade.semester === 1 ? 'Ganjil' : 'Genap';
                    downloadHtml += `<a href="${grade.linkPDF}" target="_blank" class="list-group-item list-group-item-action pl-5">Rapor Semester ${semesterText}</a>`;
                }
            });

            // Cek jika ini adalah data Kelas 6 dan ada link ijazah
            if (className === 'Kelas 6') {
                // Link ijazah tersimpan di data semester 2
                const dataSemester2 = classData.links.find(g => g.semester === 2);
                if (dataSemester2 && dataSemester2.linkIjazah) {
                    downloadHtml += `<a href="${dataSemester2.linkIjazah}" target="_blank" class="list-group-item list-group-item-action pl-5 bg-light font-weight-bold text-success">Unduh Ijazah</a>`;
                }
            }

            downloadHtml += `</div>`;
        });
    } else {
        downloadHtml = '<p class="text-muted small p-2">Belum ada rapor PDF yang diunggah oleh wali kelas.</p>';
    }
    downloadModalBody.innerHTML = downloadHtml;

    drawChart();
    
    document.getElementById('bukaFilterModalBtn').addEventListener('click', () => {
        $('#filterMapelModal').modal('show');
    });

    document.querySelectorAll('#filterModalBody .mapel-filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#filterModalBody .mapel-filter-btn').forEach(b => {
                b.classList.remove('btn-primary');
                b.classList.add('btn-outline-primary');
            });
            this.classList.add('btn-primary');
            this.classList.remove('btn-outline-primary');
            
            const filterText = this.dataset.mapel === 'rata-rata' ? 'Rata-rata Keseluruhan' : this.dataset.mapel;
            document.getElementById('filter-display-text').textContent = filterText;
            
            drawChart(this.dataset.mapel);
            
            $('#filterMapelModal').modal('hide');
        });
    });

    document.getElementById('bukaDownloadModalBtn').addEventListener('click', () => {
        $('#downloadRaporModal').modal('show');
    });
}


// Event listener untuk tombol pilihan semester di modal
document.querySelectorAll('#selectSemesterModal .semester-select-option').forEach(btn => {
    btn.addEventListener('click', function() {
        const selectedSemester = parseInt(this.dataset.semester);
        fetchRekapSiswa(selectedSemester); // Panggil fungsi untuk memuat data semester yang dipilih
        $('#selectSemesterModal').modal('hide'); // Tutup modal
    });
});

</script>
